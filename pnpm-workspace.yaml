packages:
  - 'packages/*'

nodeLinker: hoisted
autoInstallPeers: false

# esbuild 的 postinstall 负责落地平台二进制（import 'esbuild' 走的是它，
# 不是 CLI）。pnpm 11 起默认拦截依赖的构建脚本并报 ERR_PNPM_IGNORED_BUILDS，
# 这里显式放行，否则 CI 的 install 阶段就黄。
# 字段名由 pnpm approve-builds 写入（早期文档写的 onlyBuiltDependencies 不生效）。
allowBuilds:
  esbuild: true
