name: CI

on:
  push:
    branches: [main]
  pull_request:

# 仓库现收录 2 个插件。矩阵的 package 维度保留：将来加回插件时不必改
# CI 结构，直接往列表里加一行即可。
# 平台两个都必须保留：插件的构建与产物是平台相关的（Windows 走 cmd.exe、
# Linux 走 POSIX），单平台绿不代表另一侧可用。
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - dsh-context-memory
          - dsh-theme-studio
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
        working-directory: packages/${{ matrix.package }}
      - run: pnpm run build
        working-directory: packages/${{ matrix.package }}
      - run: pnpm test
        working-directory: packages/${{ matrix.package }}
