name: CI

on:
  push:
    branches: [main]
  pull_request:

# 9 个插件共用一份 CI。矩阵同时覆盖 9 个包 × 2 个平台。
# 平台都必须保留：guard 的编译与执行是平台相关的（Windows 走 cmd.exe，
# Linux 走 POSIX），单平台绿不代表另一侧可用。
# 注意 dsh-spill-hygiene 的 Linux 侧尚未在本机实测：它按 POSIX 语义假设
# process.kill(超出 pid_max 的值, 0) 抛 ESRCH，且对目录 symlink 的创建权限做了
# 环境降级（无权限即跳过该条断言）。双平台矩阵正是这两条假设的验证场。
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - dsh-context-memory
          - dsh-cost-track
          - dsh-model-arena
          - dsh-prompt-vcs
          - dsh-spill-hygiene
          - dsh-step-trace
          - dsh-theme-studio
          - dsh-tool-stats
          - dsh-verdict
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
        working-directory: packages/${{ matrix.package }}
      - run: pnpm run build
        working-directory: packages/${{ matrix.package }}
      - run: pnpm test
        working-directory: packages/${{ matrix.package }}
